[project]
name = "hifazat-backend"
version = "0.1.0"
description = "Hifazat (حفاظت): private AI scam shield for families (English and Urdu), powered by Gemma 4"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.40",
    "openai-agents>=0.0.10",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "tavily-python>=0.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
